name: Release

# On a v* tag: test, build session-menu for Linux, Windows and macOS
# (package.sh), and publish the archives as a GitHub release.
# Run by hand (Actions > Release > Run workflow): the same, without the
# release; the archives are kept as an artifact of the run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the tags, from which go build takes the version that
          # session-menu -version prints
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build and pack
        run: ./package.sh

      - name: Check the version of the Linux build
        run: |
          tar -xzf dist/session-menu_*_linux_amd64.tar.gz -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}"/session-menu_*_linux_amd64/session-menu -version

      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "session-menu ${{ github.ref_name }}" \
            --generate-notes
